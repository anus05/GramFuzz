target:
  url: "http://127.0.0.1:3000/"
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"
  authorized: false
  allow_private_addresses: false

scan:
  method: GET
  parameter: q
  timeout: 5
  delay: 0.5
  max_requests: 20
  max_payloads: 5
  repeats_per_payload: 1
  max_response_bytes: 1048576
  concurrency: 1
  mutation_strategies:
    - lowercase
    - uppercase

grammar:
  file: ../grammars/demo.json
  max_depth: 10
  seed: 42
  max_length: 4096

reporting:
  output_dir: ../reports
  formats:
    - json
    - html

storage:
  database: ../.gramfuzz/scans.sqlite3
