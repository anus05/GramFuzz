name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project from source and test dependencies
        run: python -m pip install ".[dev]"
      - name: Run unit, integration, and security regression tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist
      - name: Verify package contents
        run: |
          python - <<'PY'
          import re
          import tarfile
          import zipfile
          from pathlib import Path

          windows_absolute_path = re.compile(
              rb"(?i)(?<![A-Z0-9_])[A-Z]:(?:\\{1,2}|/)[^\s\"'<>]+"
          )
          posix_absolute_path = re.compile(
              rb"(?i)(?<!&lt;)(?<![A-Za-z0-9_:<>./])/(?!/)"
              rb"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
              rb"(?:/[A-Za-z0-9_.-]+)*"
          )
          expected = {
              "gramfuzz/grammars/sql_syntax.json",
              "gramfuzz/grammars/xss_reflection.json",
              "gramfuzz/grammars/path_validation.json",
          }
          forbidden_parts = {
              ".git", ".gramfuzz", ".pytest_cache", "build", "dist",
              "reports", "venv", ".venv",
          }

          def find_absolute_path(content):
              for pattern in (windows_absolute_path, posix_absolute_path):
                  for match in pattern.finditer(content):
                      candidate = match.group(0)
                      normalized = candidate.replace(b"\\\\", b"\\").lower()
                      if normalized == b"c:\\outside.json":
                          continue
                      return candidate
              return None

          expected_paths = [
              b"C:\\Users\\runner\\private.txt",
              b"D:\\workspace\\GramFuzz\\private.txt",
              b"D:/agent/_work/GramFuzz/private.txt",
              b"/home/runner/work/GramFuzz/private.txt",
              b"/Users/runner/GramFuzz/private.txt",
              b"/opt/hostedtoolcache/Python/private.txt",
              b"/tmp/gramfuzz-build/private.txt",
          ]
          assert all(find_absolute_path(path) for path in expected_paths), (
              "Absolute-path detector missed a representative local path."
          )
          legitimate_paths = [
              b"gramfuzz/grammars/sql_syntax.json",
              b"http://127.0.0.1:3000/path/to/fixture",
              b"./gramfuzz_path_marker",
              b"../gramfuzz_path_marker",
              b"</html>",
              b"C:\\\\outside.json",
          ]
          assert all(find_absolute_path(path) is None for path in legitimate_paths), (
              "Absolute-path detector flagged a legitimate package path or fixture."
          )

          def verify_names(names, label):
              normalized = [name.replace("\\", "/").lower() for name in names]
              for original, name in zip(names, normalized):
                  match = find_absolute_path(original.encode("utf-8"))
                  assert match is None, (
                      f"{label} has an absolute archive path: {original!r}"
                  )
                  parts = set(name.split("/"))
                  assert not parts.intersection(forbidden_parts), (
                      f"{label} includes local/generated path: {name}"
                  )
                  assert not name.endswith(
                      (".sqlite", ".sqlite3", ".db", ".env", ".pem", ".key")
                  ), f"{label} includes local or secret-like file: {name}"
                  assert ".env." not in name, (
                      f"{label} includes environment file: {name}"
                  )
              return normalized

          def verify_contents(read_file, names, label):
              for name in names:
                  content = read_file(name)
                  if content is None:
                      continue
                  match = find_absolute_path(content)
                  assert match is None, (
                      f"{label} includes an absolute local path in {name}: "
                      f"{match!r}"
                  )

          wheel_path = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel_path) as archive:
              wheel_names = verify_names(archive.namelist(), "wheel")
              verify_contents(archive.read, archive.namelist(), "wheel")
          assert expected.issubset(set(wheel_names)), (
              "Wheel is missing one or more starter grammars."
          )

          sdist_path = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist_path, "r:gz") as archive:
              sdist_names = verify_names(archive.getnames(), "sdist")
              verify_contents(
                  lambda name: (
                      archive.extractfile(name).read()
                      if archive.getmember(name).isfile()
                      else None
                  ),
                  archive.getnames(),
                  "sdist",
              )
          for grammar in expected:
              assert any(name.endswith("/" + grammar) for name in sdist_names), (
                  f"Source distribution is missing {grammar}."
              )
          print(f"Verified {wheel_path} and {sdist_path}")
          PY
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test installed CLI and package resources
        working-directory: ${{ runner.temp }}
        run: |
          GRAMMAR_DIR=$(python -c "from importlib.resources import files; print(files('gramfuzz.grammars'))")
          for grammar in sql_syntax.json xss_reflection.json path_validation.json; do
            gramfuzz grammar validate "$GRAMMAR_DIR/$grammar"
          done
          gramfuzz --help
          gramfuzz --version
          first=$(mktemp)
          second=$(mktemp)
          gramfuzz generate --grammar "$GRAMMAR_DIR/sql_syntax.json" --count 10 --seed 42 > "$first"
          gramfuzz generate --grammar "$GRAMMAR_DIR/sql_syntax.json" --count 10 --seed 42 > "$second"
          cmp "$first" "$second"
          rm "$first" "$second"
      - name: Upload wheel and source distribution
        uses: actions/upload-artifact@v5
        with:
          name: gramfuzz-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
